# SDI Live as an installed app (mobile/): an Android test APK to download, and a check that the iPhone app builds on a Mac.
# The iPhone app needs SDI's Apple Developer account to be signed for real phones - this only proves it compiles.
name: SDI Live app

on:
  push:
    paths: ["mobile/**", ".github/workflows/sdi-live-app.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: SDI-Live-Android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # The same APK at one fixed link that opens on a phone without a GitHub login:
      # https://github.com/<owner>/<repo>/releases/download/sdi-live-android-test/SDI-Live.apk
      - name: Publish the test APK at a fixed link
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SDI-Live.apk
          gh release view sdi-live-android-test >/dev/null 2>&1 || \
            gh release create sdi-live-android-test --prerelease --target "$GITHUB_SHA" \
              --title "SDI Live - Android test app" --notes "Test build of the SDI Live app for Android. Sign in with your SDI Microsoft account."
          gh release upload sdi-live-android-test SDI-Live.apk --clobber

  ios-check:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx cap sync ios
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
